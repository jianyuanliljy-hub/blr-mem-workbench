name: macOS preview build
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            arch: arm64
          - os: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.os }}
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install ".[test,build]"
      - run: python -m pytest -q
      - run: python tools/build_macos.py --skip-gui-check
      - run: python tools/validate_macos.py --bundle "dist/BLR-MEM-macOS-${{ matrix.arch }}" --out build/native-check --skip-gui-check
      - run: ditto -c -k --keepParent "dist/BLR-MEM-macOS-${{ matrix.arch }}" "dist/BLR-MEM-macOS-${{ matrix.arch }}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: BLR-MEM-macOS-${{ matrix.arch }}-preview
          path: |
            dist/*.zip
            build/native-check/validation.json

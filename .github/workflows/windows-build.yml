name: Windows preview build
on:
  push:
    branches: [chris-update]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-runtime.txt
      - run: python -m pip install ".[test,build,jax,numba]"
      - run: python -m pytest -q
      - run: python tools/build_windows.py
      - uses: actions/upload-artifact@v4
        with:
          name: BLR-RM-Windows-preview
          path: dist/BLR-MEM-Windows-x64.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Windows-validation-evidence
          path: |
            build/frozen-validation/
            build/build_identity.json

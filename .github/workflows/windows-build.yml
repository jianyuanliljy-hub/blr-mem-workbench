name: Windows preview build
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-runtime.txt
      - run: python -m pip install ".[test,build]"
      - run: python -m pytest -q
      - run: python tools/build_windows.py
      - run: dist/BLR-RM/BLRWorkbench.exe --gui-flow --out build/windows-gui-flow.json
      - uses: actions/upload-artifact@v4
        with:
          name: BLR-RM-Windows-preview
          path: dist/BLR-RM/

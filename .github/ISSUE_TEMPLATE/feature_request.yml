name: 改进建议 · Feature request
description: 提出一个具体场景和更简单的使用方式。
body:
  - type: textarea
    id: use_case
    attributes:
      label: 想解决什么问题 · Use case
      description: 描述现在的操作、遇到的困难和希望得到的结果。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议的改进 · Proposal
      description: 如涉及科学参数、算法或指标，请说明会怎样影响已有结果。
    validations:
      required: true
